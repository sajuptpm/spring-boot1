name: Build and Deploy Snapshot
on:
  workflow_dispatch:
#  push:
#    branches:
#      - 'main'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build-and-deploy-snapshot:
    name: Build and Deploy Snapshot
    if: ${{ github.repository == 'sajuptpm/spring-boot1' || github.repository == 'sajuptpm/spring-boot' || github.repository == 'spring-projects/spring-boot' || github.repository == 'spring-projects/spring-boot-commercial' || vars.ENABLE_SNAPSHOT_BUILD == 'true' }}
    runs-on: ${{ vars.UBUNTU_MEDIUM || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Deployment Target
        id: deploy-config
        shell: bash
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          COMMERCIAL_ARTIFACTORY_USERNAME: ${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          if [ "${{ vars.COMMERCIAL }}" = "true" ] && [ -n "$COMMERCIAL_ARTIFACTORY_USERNAME" ]; then
            echo "has_artifactory=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$ARTIFACTORY_USERNAME" ]; then
            echo "has_artifactory=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifactory=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$GOOGLE_CHAT_WEBHOOK_URL" ]; then
            echo "has_notification=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notification=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and Publish
        id: build-and-publish
        uses: ./.github/actions/build
        with:
          commercial-release-repository-url: ${{ vars.COMMERCIAL_RELEASE_REPO_URL }}
          commercial-repository-password: ${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}
          commercial-repository-username: ${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}
          commercial-snapshot-repository-url: ${{ vars.COMMERCIAL_SNAPSHOT_REPO_URL }}
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          gradle-cache-read-only: false
          publish: true
      - name: Deploy to Artifactory
        if: steps.deploy-config.outputs.has_artifactory == 'true'
        uses: spring-io/artifactory-deploy-action@9cb1c7df78cd8d1223de1dde974819fa6378af9f # v0.0.6
        with:
          build-name: ${{ vars.COMMERCIAL && format('spring-boot-commercial-{0}', '4.2.x') || format('spring-boot-{0}', '4.2.x') }}
          folder: 'deployment-repository'
          password: ${{ vars.COMMERCIAL && secrets.COMMERCIAL_ARTIFACTORY_PASSWORD || secrets.ARTIFACTORY_PASSWORD }}
          project: ${{ vars.COMMERCIAL && 'spring' || vars.ARTIFACTORY_PROJECT }}
          repository: ${{ vars.COMMERCIAL && 'spring-enterprise-maven-dev-local' || vars.ARTIFACTORY_REPOSITORY || 'libs-snapshot-local' }}
          signing-key: ${{ secrets.GPG_PRIVATE_KEY }}
          signing-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          threads: 8
          uri: ${{ vars.COMMERCIAL && vars.COMMERCIAL_DEPLOY_REPO_URL || vars.ARTIFACTORY_DEPLOY_REPO_URL || 'https://repo.spring.io' }}
          username: ${{ vars.COMMERCIAL && secrets.COMMERCIAL_ARTIFACTORY_USERNAME || secrets.ARTIFACTORY_USERNAME }}
      - name: Create Snapshot Zip Archive
        if: steps.deploy-config.outputs.has_artifactory != 'true'
        shell: bash
        run: |
          version="${{ steps.build-and-publish.outputs.version }}"
          echo "Packaging deployment repository for version $version..."
          zip -r "spring-boot-${version}-snapshot.zip" deployment-repository
      - name: Deploy to GitHub Release
        if: steps.deploy-config.outputs.has_artifactory != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ steps.build-and-publish.outputs.version }}"
          tag_name="v${version}-build.${{ github.run_number }}"
          echo "Publishing GitHub Pre-release $tag_name..."
          gh release create "$tag_name" \
            "spring-boot-${version}-snapshot.zip" \
            --repo "${{ github.repository }}" \
            --title "Spring Boot ${version} (Build #${{ github.run_number }})" \
            --notes "Snapshot build artifacts generated from commit ${{ github.sha }} on branch ${{ github.ref_name }}." \
            --prerelease
      - name: Upload Snapshot Artifact
        if: steps.deploy-config.outputs.has_artifactory != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-${{ steps.build-and-publish.outputs.version }}-snapshot
          path: spring-boot-${{ steps.build-and-publish.outputs.version }}-snapshot.zip
          retention-days: 14
      - name: Send Notification
        if: always() && steps.deploy-config.outputs.has_notification == 'true'
        uses: ./.github/actions/send-notification
        with:
          build-scan-url: ${{ steps.build-and-publish.outputs.build-scan-url }}
          run-name: ${{ format('{0} | Linux | Java 25', github.ref_name) }}
          status: ${{ job.status }}
          webhook-url: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
    outputs:
      version: ${{ steps.build-and-publish.outputs.version }}
  trigger-docs-build:
    name: Trigger Docs Build
    needs: build-and-deploy-snapshot
    if: ${{ vars.TRIGGER_DOCS_BUILD == 'true' || github.repository == 'spring-projects/spring-boot' }}
    permissions:
      actions: write
    runs-on: ${{ vars.UBUNTU_SMALL || 'ubuntu-latest' }}
    steps:
      - name: Run Deploy Docs Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-docs.yml --repo ${{ github.repository }} -r docs-build -f build-sha=${{ github.sha }} -f build-refname=${{ github.ref_name }} -f build-version=${{ needs.build-and-deploy-snapshot.outputs.version }}
  verify:
    name: Verify
    needs: build-and-deploy-snapshot
    if: ${{ vars.ENABLE_VERIFY == 'true' || github.repository == 'spring-projects/spring-boot' }}
    uses: ./.github/workflows/verify.yml
    secrets:
      commercial-repository-password: ${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}
      commercial-repository-username: ${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}
      google-chat-webhook-url: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
      opensource-repository-password: ${{ secrets.ARTIFACTORY_PASSWORD }}
      opensource-repository-username: ${{ secrets.ARTIFACTORY_USERNAME }}
      token: ${{ secrets.GH_ACTIONS_REPO_TOKEN }}
    with:
      version: ${{ needs.build-and-deploy-snapshot.outputs.version }}
