name: Publicize Release
on:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Release version or milestone to publicize (e.g. 4.2.0, 4.2.1). Leave blank to read from gradle.properties'
        required: false
        default: ''
      latest:
        description: 'Mark as latest release (true/false)'
        required: false
        default: 'true'
  push:
    tags:
      - 'v4.2.[0-9]+'
      - 'v*.[0-9]+'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  read-version:
    name: Read Version
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Version From gradle.properties
        id: read-version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.milestone }}" ]; then
            version="${{ github.event.inputs.milestone }}"
          else
            version=$(sed -n 's/version=\(.*\)/\1/p' gradle.properties)
          fi
          echo "Version is $version"
          echo "version=$version" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.read-version.outputs.version }}

  publish-gradle-plugin:
    name: Publish Gradle Plugin
    needs:
      - read-version
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine Publishing Target
        id: target
        shell: bash
        run: |
          if [ "${{ vars.PLUGIN_PUBLISH_TARGET }}" = "gradle-portal" ] || { [ -n "${{ secrets.GRADLE_PLUGIN_PUBLISH_KEY }}" ] && [ "${{ vars.PLUGIN_PUBLISH_TARGET }}" != "github-native" ]; }; then
            echo "mode=gradle-portal" >> $GITHUB_OUTPUT
          else
            echo "mode=github-native" >> $GITHUB_OUTPUT
          fi
      - name: Prepare Gradle Build
        if: steps.target.outputs.mode == 'github-native'
        uses: ./.github/actions/prepare-gradle-build
        with:
          cache-read-only: 'false'
          java-version: '25'
      - name: Build Gradle Plugin (GitHub Native)
        if: steps.target.outputs.mode == 'github-native'
        shell: bash
        run: |
          version="${{ needs.read-version.outputs.version }}"
          echo "Building Gradle Plugin publication for $version..."
          ./gradlew :build-plugin:spring-boot-gradle-plugin:publishPluginMavenPublicationToProjectRepository -x test -Pversion="$version"
      - name: Publish to GitHub Packages (Maven)
        if: steps.target.outputs.mode == 'github-native'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo_dir="build-plugin/spring-boot-gradle-plugin/build/maven-repository"
          if [ -d "$repo_dir" ]; then
            echo "Publishing plugin artifacts to GitHub Packages (https://maven.pkg.github.com/${{ github.repository }})..."
            find "$repo_dir" -type f | while read -r file; do
              rel_path="${file#$repo_dir/}"
              echo "Uploading $rel_path..."
              curl -s -o /dev/null -w "%{http_code}\n" -X PUT \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -T "$file" \
                "https://maven.pkg.github.com/${{ github.repository }}/$rel_path" || true
            done
          fi
      - name: Upload Plugin Artifacts
        if: steps.target.outputs.mode == 'github-native'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: spring-boot-gradle-plugin-v${{ needs.read-version.outputs.version }}
          path: build-plugin/spring-boot-gradle-plugin/build/maven-repository/
          if-no-files-found: warn
      - name: Publish to Gradle Plugin Portal (Original Upstream)
        if: steps.target.outputs.mode == 'gradle-portal'
        uses: ./.github/actions/publish-gradle-plugin
        with:
          build-number: '2026.4'
          gradle-plugin-publish-key: ${{ secrets.GRADLE_PLUGIN_PUBLISH_KEY }}
          gradle-plugin-publish-secret: ${{ secrets.GRADLE_PLUGIN_PUBLISH_SECRET }}
          jfrog-cli-config-token: ${{ secrets.JF_ARTIFACTORY_SPRING }}
          plugin-version: ${{ needs.read-version.outputs.version }}

  publish-to-sdkman:
    name: Publish to SDKMAN!
    needs:
      - read-version
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine SDKMAN Target
        id: sdkman-target
        shell: bash
        run: |
          if [ "${{ vars.ENABLE_SDKMAN_PUBLISH }}" = "true" ] && [ -n "${{ secrets.SDKMAN_CONSUMER_KEY }}" ]; then
            echo "mode=upstream" >> $GITHUB_OUTPUT
          else
            echo "mode=github-native" >> $GITHUB_OUTPUT
          fi
      - name: Prepare Gradle Build
        if: steps.sdkman-target.outputs.mode == 'github-native'
        uses: ./.github/actions/prepare-gradle-build
        with:
          cache-read-only: 'false'
          java-version: '25'
      - name: Package Spring Boot CLI Binary (GitHub Native)
        if: steps.sdkman-target.outputs.mode == 'github-native'
        shell: bash
        run: |
          version="${{ needs.read-version.outputs.version }}"
          echo "Building Spring Boot CLI distribution for $version..."
          ./gradlew :cli:spring-boot-cli:distZip -x test -Pversion="$version" || true
      - name: Upload CLI Distribution Artifact
        if: steps.sdkman-target.outputs.mode == 'github-native'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: spring-boot-cli-dist-v${{ needs.read-version.outputs.version }}
          path: cli/spring-boot-cli/build/distributions/*.zip
          if-no-files-found: warn
      - name: Publish to SDKMAN! (Original Upstream)
        if: steps.sdkman-target.outputs.mode == 'upstream'
        uses: ./.github/actions/publish-to-sdkman
        with:
          make-default: false
          sdkman-consumer-key: ${{ secrets.SDKMAN_CONSUMER_KEY }}
          sdkman-consumer-token: ${{ secrets.SDKMAN_CONSUMER_TOKEN }}
          spring-boot-version: ${{ needs.read-version.outputs.version }}

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs:
      - read-version
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine Homebrew Target
        id: brew-target
        shell: bash
        run: |
          if [ "${{ github.repository }}" = "spring-projects/spring-boot" ] || [ "${{ vars.ENABLE_HOMEBREW_TAP }}" = "true" ]; then
            echo "mode=upstream" >> $GITHUB_OUTPUT
          else
            echo "mode=github-native" >> $GITHUB_OUTPUT
          fi
      - name: Generate Homebrew Formula (GitHub Native)
        if: steps.brew-target.outputs.mode == 'github-native'
        shell: bash
        run: |
          version="${{ needs.read-version.outputs.version }}"
          mkdir -p build/homebrew
          cat << EOF > build/homebrew/spring-boot.rb
          class SpringBoot < Formula
            desc "Spring Boot CLI"
            homepage "https://spring.io/projects/spring-boot"
            url "https://github.com/${{ github.repository }}/releases/download/v${version}/spring-boot-cli-${version}-bin.zip"
            version "${version}"
            
            def install
              bin.install "bin/spring"
            end

            test do
              system "#{bin}/spring", "--version"
            end
          end
          EOF
          echo "Generated Homebrew formula in build/homebrew/spring-boot.rb"
      - name: Upload Homebrew Formula Artifact
        if: steps.brew-target.outputs.mode == 'github-native'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: spring-boot-homebrew-formula-v${{ needs.read-version.outputs.version }}
          path: build/homebrew/spring-boot.rb
          if-no-files-found: warn
      - name: Update Homebrew Tap (Original Upstream)
        if: steps.brew-target.outputs.mode == 'upstream'
        uses: ./.github/actions/update-homebrew-tap
        with:
          spring-boot-version: ${{ needs.read-version.outputs.version }}
          token: ${{ secrets.GH_ACTIONS_REPO_TOKEN || secrets.GITHUB_TOKEN }}

  trigger-docs-build:
    name: Trigger Docs Build
    needs:
      - read-version
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine Docs Build Mode
        id: docs-mode
        shell: bash
        run: |
          if [ "${{ vars.DOCS_BUILD_TARGET }}" = "upstream" ] || [ "${{ github.repository }}" = "spring-projects/spring-boot" ]; then
            echo "mode=upstream" >> $GITHUB_OUTPUT
          else
            echo "mode=github-native" >> $GITHUB_OUTPUT
          fi
      - name: Trigger Upstream Deploy Docs Workflow
        if: steps.docs-mode.outputs.mode == 'upstream'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-docs.yml --repo ${{ github.repository }} -r docs-build \
            -f build-refname=${{ github.ref_name }} \
            -f build-version=${{ needs.read-version.outputs.version }}
      - name: Package Documentation (GitHub Native)
        if: steps.docs-mode.outputs.mode == 'github-native'
        shell: bash
        run: |
          version="${{ needs.read-version.outputs.version }}"
          mkdir -p build/docs-package
          echo "Packaging documentation source and reference modules for v${version}..."
          
          cat << 'EOF' > build/docs-package/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Spring Boot Documentation</title>
            <meta http-equiv="refresh" content="0; url=https://docs.spring.io/spring-boot/index.html">
          </head>
          <body>
            <h1>Spring Boot Documentation</h1>
            <p>Redirecting to <a href="https://docs.spring.io/spring-boot/index.html">Spring Boot Reference Guide</a>...</p>
          </body>
          </html>
          EOF
          
          cp -r documentation/spring-boot-docs/src/docs/antora build/docs-package/antora-docs || true
          cp -r build-plugin/spring-boot-gradle-plugin/src/docs/antora build/docs-package/gradle-plugin-docs || true
          
          cd build && zip -r "spring-boot-docs-v${version}.zip" docs-package
      - name: Upload Documentation Artifact
        if: steps.docs-mode.outputs.mode == 'github-native'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: spring-boot-docs-v${{ needs.read-version.outputs.version }}
          path: build/spring-boot-docs-v*.zip
          if-no-files-found: warn

  create-github-release:
    name: Create GitHub Release
    needs:
      - read-version
      - publish-gradle-plugin
      - publish-to-sdkman
      - trigger-docs-build
      - update-homebrew-tap
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: write
      issues: write
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Plugin Artifacts
        uses: actions/download-artifact@v8
        with:
          name: spring-boot-gradle-plugin-v${{ needs.read-version.outputs.version }}
          path: downloaded-artifacts/plugin/
        continue-on-error: true
      - name: Download Docs Artifacts
        uses: actions/download-artifact@v8
        with:
          name: spring-boot-docs-v${{ needs.read-version.outputs.version }}
          path: downloaded-artifacts/docs/
        continue-on-error: true
      - name: Download CLI Artifacts
        uses: actions/download-artifact@v8
        with:
          name: spring-boot-cli-dist-v${{ needs.read-version.outputs.version }}
          path: downloaded-artifacts/cli/
        continue-on-error: true
      - name: Download Homebrew Artifacts
        uses: actions/download-artifact@v8
        with:
          name: spring-boot-homebrew-formula-v${{ needs.read-version.outputs.version }}
          path: downloaded-artifacts/homebrew/
        continue-on-error: true
      - name: Ensure Git Tag Exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.read-version.outputs.version }}"
          tag="v${version}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag not found locally or on remote. Creating tag $tag..."
            git tag "$tag"
            git push origin "$tag" || true
          else
            echo "Tag $tag already exists."
          fi
      - name: Ensure GitHub Milestone Exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          milestone="${{ needs.read-version.outputs.version }}"
          echo "Ensuring GitHub milestone exists for: $milestone"
          gh api "repos/${{ github.repository }}/milestones" -f title="$milestone" -f state="open" || true
      - name: Create GitHub Release
        uses: ./.github/actions/create-github-release
        with:
          commercial: ${{ vars.COMMERCIAL || false }}
          latest: ${{ github.event.inputs.latest || 'true' }}
          milestone: ${{ needs.read-version.outputs.version }}
          token: ${{ secrets.GH_ACTIONS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Attach Built Assets to GA Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.read-version.outputs.version }}"
          echo "Attaching built artifacts to release $tag..."
          if [ -d "downloaded-artifacts" ]; then
            find downloaded-artifacts -type f \( -name "*.jar" -o -name "*.zip" -o -name "*.pom" -o -name "*.rb" \) | while read -r asset; do
              echo "Uploading $asset..."
              gh release upload "$tag" "$asset" --clobber || true
            done
          fi
