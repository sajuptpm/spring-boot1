name: Run System Tests
on:
  workflow_dispatch:
    inputs:
      java-version:
        description: "Target Java toolchain version ('all', '17', or '21')"
        required: false
        default: "all"
        type: "choice"
        options:
          - "all"
          - "21"
          - "17"
      system-test-target:
        description: "System test target ('deployment', 'image', or 'all')"
        required: false
        default: "deployment"
        type: "choice"
        options:
          - "deployment"
          - "image"
          - "all"
  # push:
  #   branches:
  #     - "main"
permissions:
  contents: read
jobs:
  run-system-tests:
    name: "Java ${{ matrix.java.version}}"
    if: ${{ github.repository == 'sajuptpm/spring-boot1' || github.repository == 'sajuptpm/spring-boot' || github.repository == 'spring-projects/spring-boot' }}
    runs-on: ${{ vars.UBUNTU_MEDIUM || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        java:
          - version: "17"
            toolchain: true
          - version: "21"
            toolchain: true
    steps:
      - name: Switch Docker to Overlay2
        if: ${{ inputs.java-version == null || inputs.java-version == 'all' || inputs.java-version == matrix.java.version }}
        shell: bash
        run: |
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Check Out Code
        if: ${{ inputs.java-version == null || inputs.java-version == 'all' || inputs.java-version == matrix.java.version }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Gradle Build
        if: ${{ inputs.java-version == null || inputs.java-version == 'all' || inputs.java-version == matrix.java.version }}
        uses: ./.github/actions/prepare-gradle-build
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          java-toolchain: ${{ matrix.java.toolchain }}
          java-version: ${{ matrix.java.version }}
      - name: Run System Tests
        if: ${{ inputs.java-version == null || inputs.java-version == 'all' || inputs.java-version == matrix.java.version }}
        id: run-system-tests
        shell: bash
        run: |
          TARGET="${{ inputs.system-test-target || 'all' }}"
          case "$TARGET" in
            "deployment")
              TASK=":system-test:spring-boot-deployment-system-tests:systemTest"
              ;;
            "image")
              TASK=":system-test:spring-boot-image-system-tests:systemTest"
              ;;
            *)
              TASK="systemTest"
              ;;
          esac
          echo "Executing system test task: ./gradlew $TASK"
          ./gradlew $TASK
      - name: Show docker info
        if: ${{ (inputs.java-version == null || inputs.java-version == 'all' || inputs.java-version == matrix.java.version) && always() }}
        shell: bash
        run: docker version ; docker info
      - name: List docker images
        if: ${{ (inputs.java-version == null || inputs.java-version == 'all' || inputs.java-version == matrix.java.version) && always() }}
        shell: bash
        run: docker image ls --digests
      - name: Record Job Summary
        if: ${{ (inputs.java-version == null || inputs.java-version == 'all' || inputs.java-version == matrix.java.version) && always() }}
        shell: bash
        run: |
          echo "### System Tests – Java ${{ matrix.java.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Java Toolchain** | Java \`${{ matrix.java.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Test Target** | \`${{ inputs.system-test-target || 'all' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow Run** | [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
      - name: Upload Test Reports
        if: ${{ (inputs.java-version == null || inputs.java-version == 'all' || inputs.java-version == matrix.java.version) && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: "system-test-reports-java-${{ matrix.java.version }}"
          path: "**/build/reports"
          if-no-files-found: ignore
      - name: Send Notification
        if: ${{ (inputs.java-version == null || inputs.java-version == 'all' || inputs.java-version == matrix.java.version) && always() }}
        uses: ./.github/actions/send-notification
        with:
          build-scan-url: ${{ steps.run-system-tests.outputs.build-scan-url }}
          run-name: ${{ format('{0} | System Tests | Java {1}', github.ref_name, matrix.java.version) }}
          status: ${{ job.status }}
          webhook-url: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
