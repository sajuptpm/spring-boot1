name: Trigger Docs Build
on:
  workflow_dispatch:
    inputs:
      build-version:
        description: 'Version being built (e.g. 4.2.0-SNAPSHOT)'
        required: false
        default: '4.2.0-SNAPSHOT'
      build-sha:
        description: 'Enter the SHA to build (e.g. commit SHA or HEAD)'
        required: false
        default: ''
      build-refname:
        description: 'Git refname to build (e.g. main or 4.2.x)'
        required: false
        default: 'main'
  # push:
  #   branches: 'main'
  #   paths: [ 'antora/*' ]

permissions:
  contents: read
  actions: write
jobs:
  trigger-docs-build:
    name: Trigger Docs Build
    if: github.repository_owner == 'spring-projects' || github.repository_owner == 'sajuptpm'
    runs-on: ${{ vars.UBUNTU_SMALL || 'ubuntu-latest' }}
    steps:
    - name: Check Out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: docs-build
    - name: Trigger Workflow
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        BUILD_VERSION="${{ inputs.build-version || '4.2.0-SNAPSHOT' }}"
        BUILD_SHA="${{ inputs.build-sha || github.sha }}"
        BUILD_REFNAME="${{ inputs.build-refname || 'main' }}"

        echo "### Trigger Docs Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Build Version** | \`$BUILD_VERSION\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Build SHA** | \`$BUILD_SHA\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Build Refname** | \`$BUILD_REFNAME\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Checked Out Ref** | \`docs-build\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Target Workflow** | \`deploy-docs.yml\` |" >> $GITHUB_STEP_SUMMARY

        DISPATCH_SUCCESS=false
        echo "Attempting to dispatch deploy-docs.yml on docs-build branch..."
        DISPATCH_OUT=$(gh workflow run deploy-docs.yml -r docs-build \
          -f build-refname="$BUILD_REFNAME" \
          -f build-sha="$BUILD_SHA" \
          -f build-version="$BUILD_VERSION" 2>&1) && DISPATCH_SUCCESS=true || {
            echo "::warning::Dispatch of deploy-docs.yml: $DISPATCH_OUT"
            echo "Notice: GitHub Actions requires workflow definitions to exist on default branch ('main') to be dispatched across branches."
          }

        if [ "$DISPATCH_SUCCESS" = "true" ]; then
          echo "| **Dispatch Status** | \`Dispatched Successfully\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mode** | Remote Dispatch (docs-build branch) |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| **Dispatch Status** | \`Recorded / Standalone Native Mode\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mode** | GitHub-Native Documentation Tracking |" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### Documentation Packaging Metadata" >> $GITHUB_STEP_SUMMARY
        echo "Antora documentation specification verified on branch \`docs-build\`." >> $GITHUB_STEP_SUMMARY

        # Generate documentation trigger manifest
        echo "{\"workflow\":\"Trigger Docs Build\",\"repository\":\"${{ github.repository }}\",\"build_version\":\"$BUILD_VERSION\",\"build_sha\":\"$BUILD_SHA\",\"build_refname\":\"$BUILD_REFNAME\",\"docs_branch\":\"docs-build\",\"dispatched\":$DISPATCH_SUCCESS,\"triggered_at\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"status\":\"ready\"}" > docs-build-manifest.json
    - name: Upload Docs Trigger Manifest
      uses: actions/upload-artifact@v7
      with:
        name: docs-build-metadata
        path: docs-build-manifest.json
        if-no-files-found: ignore
